id: gcc
version: "12"
os: ubuntu-22
# Installs versioned binaries (gcc-12, g++-12) and registers them with
# update-alternatives, so other gcc versions can be installed alongside.
# Alternative priority = version, so the newest installed gcc is the default.
coexist: true
steps:
  - name: Install gcc 12
    packages:
      - gcc-12
      - g++-12
  - name: Register gcc 12 with update-alternatives
    run:
      - update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 120 --slave /usr/bin/g++ g++ /usr/bin/g++-12
addons:
  gdb: ["14"]
  valgrind: ["3"]
