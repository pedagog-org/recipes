id: python
version: "3.11"
os: ubuntu-22
# Installs python3.11 next to the system python3 (3.10, which apt tooling needs)
# and registers it under /usr/local/bin, which precedes /usr/bin on PATH, so
# /usr/bin/python3 is never touched. Other python versions can be installed
# alongside; alternative priority = version, so the newest is the default.
coexist: true
addons:
  pedagog-pytest: ["1", "2"]
steps:
  - name: Install add-apt-repository
    packages:
      - software-properties-common
  - name: Add deadsnakes PPA
    run:
      - add-apt-repository -y ppa:deadsnakes/ppa
      - apt-get update
  - name: Install Python 3.11
    packages:
      - python3.11
      - python3.11-dev
      - python3.11-venv
  - name: Register python3.11 with update-alternatives
    run:
      - update-alternatives --install /usr/local/bin/python3 python3 /usr/bin/python3.11 311 --slave /usr/local/bin/python python /usr/bin/python3.11
