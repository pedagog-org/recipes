# Students compile the same program with gcc 12 and gcc 13 and compare
# diagnostics and codegen. Both gcc recipes set `coexist: true`, so both
# versions install side by side; gcc 13 is the default `gcc` (higher
# alternatives priority) and gcc-12 / g++-12 stay available by name.
#
# gdb:12 is chosen under both compilers; it's installed once, right after
# gcc:12 (its first occurrence).
#
# If a recipe did NOT declare coexist, the assignment could still force it by
# marking every entry for that version with a trailing `!`, e.g.
#   - gcc:12!+gdb:12
#   - gcc:13!+gdb:12+valgrind:3
# at the instructor's own risk.
id: compiler-comparison
name: Compiler Comparison
environment:
  os: ubuntu-22
  platform:
    kind: interactive
  toolchains:
    - gcc:12+gdb:12
    - gcc:13+gdb:12+valgrind:3
