id: ubuntu-22
upstream: ubuntu:22.04
image: pedagog/ubuntu:22

hooks:
  build:
    init:
      - run:
          # Persisted in the debconf db, so no later apt step can block on a prompt
          # (e.g. tzdata asking for a time zone).
          - echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections
          - apt-get update && apt-get upgrade -y
          - apt-get install -y ca-certificates curl jq
          - useradd -m -s /bin/bash student
          - mkdir -p /home/student/workspace
          - chown -R student:student /home/student
          - install -m755 /pedagog/recipes/lib/vend /usr/local/bin/vend
    cleanup:
      - run:
          - apt-get clean
          - rm -rf /var/lib/apt/lists/*

  pkg:
    install:
      args: [packages]
      steps:
        - run:
            - apt-get install -y {packages}
    remove:
      args: [packages]
      steps:
        - run:
            - apt-get remove --purge -y {packages}

